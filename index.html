<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Databricks Genie 聊天室</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
    background: #f5f5f7;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #app {
    width: 100%;
    max-width: 720px;
    height: 90vh;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #login-view {
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
  }
  #login-view h1 {
    font-size: 22px;
    margin-bottom: 24px;
    text-align: center;
    color: #333;
  }
  #login-view input {
    padding: 12px 16px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
  }
  #login-view button {
    padding: 12px;
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  #login-view button:hover { background: #0060c0; }
  #login-error {
    color: #d33;
    font-size: 13px;
    margin-top: 8px;
    text-align: center;
    min-height: 18px;
  }
  #chat-view {
    display: none;
    flex-direction: column;
    height: 100%;
  }
  #chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    font-weight: 600;
    color: #333;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #logout-btn {
    font-size: 13px;
    color: #888;
    background: none;
    border: none;
    cursor: pointer;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #0071e3;
    color: #fff;
  }
  .msg.bot {
    align-self: flex-start;
    background: #f0f0f2;
    color: #222;
  }
  #input-bar {
    display: flex;
    padding: 12px;
    border-top: 1px solid #eee;
    gap: 8px;
  }
  #input-bar input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid #ddd;
    border-radius: 22px;
    font-size: 15px;
    outline: none;
  }
  #input-bar button {
    padding: 0 20px;
    background: #0071e3;
    color: #fff;
    border: none;
    border-radius: 22px;
    font-size: 15px;
    cursor: pointer;
  }
  #input-bar button:disabled { background: #aaa; cursor: not-allowed; }
</style>
</head>
<body>
<div id="app">
  <div id="login-view">
    <h1>Databricks Genie 聊天室</h1>
    <input id="username" type="text" placeholder="帳號" autocomplete="username">
    <input id="password" type="password" placeholder="密碼" autocomplete="current-password">
    <button onclick="login()">登入</button>
    <div id="login-error"></div>
  </div>

  <div id="chat-view">
    <div id="chat-header">
      <span>Genie 聊天室</span>
      <button id="logout-btn" onclick="logout()">登出</button>
    </div>
    <div id="messages"></div>
    <div id="input-bar">
      <input id="msg-input" type="text" placeholder="輸入訊息…" onkeydown="if(event.key==='Enter')send()">
      <button id="send-btn" onclick="send()">送出</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "";  // 同一個網域，不用填
let token = "";
let conversationId = null;

async function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";

  if (!username || !password) {
    errEl.textContent = "請輸入帳號與密碼";
    return;
  }

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      let errMsg = data.detail;
      if (typeof errMsg !== "string") {
        errMsg = JSON.stringify(errMsg);
      }
      addMessage("bot", "錯誤：" + (errMsg || res.status));
      return;
    }
    const data = await res.json();
    token = data.token;
    document.getElementById("login-view").style.display = "none";
    document.getElementById("chat-view").style.display = "flex";
    addMessage("bot", "你好，我是 Genie。可以問我有關資料庫的問題。");
  } catch (e) {
    errEl.textContent = "連線錯誤：" + e.message;
  }
}

function logout() {
  token = "";
  conversationId = null;
  document.getElementById("messages").innerHTML = "";
  document.getElementById("chat-view").style.display = "none";
  document.getElementById("login-view").style.display = "flex";
  document.getElementById("password").value = "";
}

function addMessage(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  const box = document.getElementById("messages");
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text) return;

  addMessage("user", text);
  input.value = "";
  document.getElementById("send-btn").disabled = true;

  const loading = document.createElement("div");
  loading.className = "msg bot";
  loading.textContent = "Genie 思考中…";
  document.getElementById("messages").appendChild(loading);
  document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ message: text, conversation_id: conversationId })
    });

    loading.remove();

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      addMessage("bot", "錯誤：" + (data.detail || res.status));
      return;
    }

    const data = await res.json();
    if (data.conversation_id) conversationId = data.conversation_id;

    let reply = "";
    if (data.answer && Array.isArray(data.answer)) {
      for (const a of data.answer) {
        if (a.text && a.text.content) reply += a.text.content + "\n";
      }
    }
    addMessage("bot", reply.trim() || "（沒有回覆內容）");
  } catch (e) {
    loading.remove();
    addMessage("bot", "連線錯誤：" + e.message);
  } finally {
    document.getElementById("send-btn").disabled = false;
  }
}
</script>
</body>
</html>
